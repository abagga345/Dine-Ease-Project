name: Build and Push Frontend and Backend Docker Images on Production Update

on:
  push:
    branches:
      - pickle-website-prod

jobs:
  Continuous-Integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/DineEase
          file: ./frontend/DineEase/Dockerfile
          push: true
          tags: baggaaayush05/dine-ease-frontend:v1
          
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: baggaaayush05/dine-ease-backend:v1
          
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Backend image push
        run: docker pull baggaaayush05/dine-ease-backend:v1

      - name: Verify Frontend image push
        run: docker pull baggaaayush05/dine-ease-frontend:v1

  Continuous-Deployment:
    runs-on: ubuntu-latest
    needs: Continuous-Integration
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo docker pull baggaaayush05/dine-ease-backend:v1
            sudo docker pull baggaaayush05/dine-ease-frontend:v1
            sudo docker compose down || true
            sudo docker compose up -d

      
      